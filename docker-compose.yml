version: '3.8'
services:
  mysql:
    image: mysql:8.0
    container_name: support-ticket-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 5868
      MYSQL_DATABASE: support_ticket_system
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
